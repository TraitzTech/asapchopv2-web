# /etc/nginx/sites-available/app.asapchop.com
# certbot --nginx adds the 443/SSL parts to this file.
upstream asapchop_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.asapchop.com;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Hashed build files never change, so browsers may cache them for a year.
    location /_next/static/ {
        proxy_pass http://asapchop_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://asapchop_web;
        proxy_read_timeout 60s;
    }
}
